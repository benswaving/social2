# Wettelijke grondslagen per bezwaarcategorie.
#
# LET OP: alles hieronder komt binnen als `ongeverifieerd`. De synchronisatie
# (`python -m app.knowledge.sync wetten`) haalt de echte tekst op bij het
# officiele KOOP-repository en zet de status pas dan op `bevestigd`. Artikelen
# die daar niet gevonden worden, komen op `niet_gevonden` te staan en worden
# NOOIT in een conceptbrief geciteerd. Dat is de vangnetconstructie tegen
# verzonnen vindplaatsen - ook tegen die van deze agent zelf.

versie: "2026-08-1"

wetten:
  - bwb_id: BWBR0005291
    naam: "Burgerlijk Wetboek Boek 3"
    afkorting: BW3
  - bwb_id: BWBR0005289
    naam: "Burgerlijk Wetboek Boek 6"
    afkorting: BW6
  - bwb_id: BWBR0005288
    naam: "Burgerlijk Wetboek Boek 5"
    afkorting: BW5
  - bwb_id: BWBR0005537
    naam: "Algemene wet bestuursrecht"
    afkorting: Awb

  # --- Energierecht ---------------------------------------------------
  # De Energiewet is op 1 januari 2026 in werking getreden; de Elektriciteitswet
  # 1998 en de Gaswet zijn op diezelfde datum ingetrokken. Vorderingen over
  # periodes daarvóór moeten dus nog onder het oude recht worden beantwoord.
  # Het datamodel houdt die grens per bron bij (`geldig_vanaf` / `geldig_tot`).
  - bwb_id: BWBR0050714
    naam: "Energiewet"
    afkorting: Ew
    geldig_vanaf: "2026-01-01"
  - bwb_id: BWBR0009755
    naam: "Elektriciteitswet 1998"
    afkorting: E-wet
    geldig_tot: "2025-12-31"
    vervangen_door: Ew
  - bwb_id: BWBR0011440
    naam: "Gaswet"
    afkorting: Gaswet
    geldig_tot: "2025-12-31"
    vervangen_door: Ew

  # --- ACM-codes onder de Energiewet ----------------------------------
  # Sinds de Energiewet staan de codebesluiten in het BWB, en zijn ze dus langs
  # dezelfde weg op te halen en te verifieren als de wet zelf. Dat scheelt de
  # afdeling het handmatig aanleveren van deze documenten.
  - bwb_id: BWBR0052321
    naam: "Tarievencode elektriciteit 2026"
    afkorting: TarE
    geldig_vanaf: "2026-01-01"
  - bwb_id: BWBR0052320
    naam: "Begrippencode elektriciteit 2026"
    afkorting: BegE
    geldig_vanaf: "2026-01-01"
  - bwb_id: BWBR0052336
    naam: "Systeemcode elektriciteit 2026"
    afkorting: SysE
    geldig_vanaf: "2026-01-01"
  - bwb_id: BWBR0052332
    naam: "Aansluit- en transportcode gas DSB"
    afkorting: ATCGas
    geldig_vanaf: "2026-01-01"
  - bwb_id: null
    naam: "Aansluit- en transportcode elektriciteit"
    afkorting: ATCE
    geldig_vanaf: "2026-01-01"
    notitie: >-
      BWB-id nog niet vastgesteld. Draai `python -m app.knowledge.sync resolve-bwb
      "Aansluit- en transportcode elektriciteit"`; die zoekt het id op via de
      SRU-dienst van KOOP en drukt de regel af die hier ingevuld moet worden.
  - bwb_id: BWBR0051774
    naam: "Energieregeling"
    afkorting: Ereg
    geldig_vanaf: "2026-01-01"

artikelen:
  # --- Overeenkomst en wilsvertrouwen ---------------------------------
  - key: bw3-33
    wet: BW3
    artikel: "3:33"
    vindplaats: "art. 3:33 BW"
    onderwerp: "Rechtshandeling vereist een op rechtsgevolg gerichte wil"
    categorieen: [geen_ondertekend_contract]
  - key: bw3-35
    wet: BW3
    artikel: "3:35"
    vindplaats: "art. 3:35 BW"
    onderwerp: >-
      Bescherming van gerechtvaardigd vertrouwen: wie op grond van een verklaring
      of gedraging redelijkerwijs een overeenkomst mocht aannemen, kan zich daarop
      beroepen. Dragende bepaling tegen 'ik heb niets getekend'.
    categorieen: [geen_ondertekend_contract, pseudojuridisch]
  - key: bw6-217
    wet: BW6
    artikel: "6:217"
    vindplaats: "art. 6:217 BW"
    onderwerp: >-
      Een overeenkomst komt tot stand door aanbod en aanvaarding. De wet stelt geen
      vormvereiste; aanvaarding kan ook in gedragingen besloten liggen.
    categorieen: [geen_ondertekend_contract, geen_verbruik]
  - key: bw3-37
    wet: BW3
    artikel: "3:37"
    vindplaats: "art. 3:37 BW"
    onderwerp: "Verklaringen kunnen in iedere vorm geschieden, ook in gedragingen"
    categorieen: [geen_ondertekend_contract]
  - key: bw6-248
    wet: BW6
    artikel: "6:248"
    vindplaats: "art. 6:248 BW"
    onderwerp: "Aanvullende en beperkende werking van redelijkheid en billijkheid"
    categorieen: [algemene_voorwaarden, schrijnende_omstandigheden]

  # --- Verjaring en stuiting ------------------------------------------
  - key: bw3-307
    wet: BW3
    artikel: "3:307"
    vindplaats: "art. 3:307 BW"
    onderwerp: "Verjaring van een rechtsvordering tot nakoming van een verbintenis uit overeenkomst"
    categorieen: [verjaring]
  - key: bw3-308
    wet: BW3
    artikel: "3:308"
    vindplaats: "art. 3:308 BW"
    onderwerp: >-
      Verjaring van vorderingen tot betaling van periodiek verschuldigde bedragen.
      Relevant voor vastrecht en periodieke aansluitvergoeding.
    categorieen: [verjaring]
  - key: bw3-317
    wet: BW3
    artikel: "3:317"
    vindplaats: "art. 3:317 BW"
    onderwerp: "Stuiting van de verjaring door een schriftelijke aanmaning of mededeling"
    categorieen: [verjaring]
  - key: bw3-319
    wet: BW3
    artikel: "3:319"
    vindplaats: "art. 3:319 BW"
    onderwerp: "Nieuwe verjaringstermijn na stuiting"
    categorieen: [verjaring]

  # --- Algemene voorwaarden -------------------------------------------
  - key: bw6-231
    wet: BW6
    artikel: "6:231"
    vindplaats: "art. 6:231 BW"
    onderwerp: "Definities algemene voorwaarden"
    categorieen: [algemene_voorwaarden]
  - key: bw6-233
    wet: BW6
    artikel: "6:233"
    vindplaats: "art. 6:233 BW"
    onderwerp: >-
      Vernietigbaarheid van een beding dat onredelijk bezwarend is, of wanneer geen
      redelijke mogelijkheid tot kennisneming is geboden.
    categorieen: [algemene_voorwaarden]
  - key: bw6-234
    wet: BW6
    artikel: "6:234"
    vindplaats: "art. 6:234 BW"
    onderwerp: "Wijze waarop een redelijke mogelijkheid tot kennisneming wordt geboden"
    categorieen: [algemene_voorwaarden]

  # --- Geld, rente, incassokosten -------------------------------------
  - key: bw6-119
    wet: BW6
    artikel: "6:119"
    vindplaats: "art. 6:119 BW"
    onderwerp: "Wettelijke rente bij vertraging in de voldoening van een geldsom"
    categorieen: [hoogte_rente_en_incassokosten]
  - key: bw6-119a
    wet: BW6
    artikel: "6:119a"
    vindplaats: "art. 6:119a BW"
    onderwerp: "Wettelijke handelsrente bij handelsovereenkomsten"
    categorieen: [hoogte_rente_en_incassokosten]
  - key: bw6-96
    wet: BW6
    artikel: "6:96"
    vindplaats: "art. 6:96 BW"
    onderwerp: >-
      Vermogensschade en buitengerechtelijke incassokosten. Lid 6 bevat de
      veertiendagenbrief bij consumenten; hier gaat het bij betwisting vaak mis.
    categorieen: [hoogte_rente_en_incassokosten, algemene_voorwaarden]

  # --- Verrijking en onverschuldigde betaling -------------------------
  - key: bw6-203
    wet: BW6
    artikel: "6:203"
    vindplaats: "art. 6:203 BW"
    onderwerp: "Onverschuldigde betaling"
    categorieen: [ongerechtvaardigde_verrijking]
  - key: bw6-212
    wet: BW6
    artikel: "6:212"
    vindplaats: "art. 6:212 BW"
    onderwerp: >-
      Ongerechtvaardigde verrijking. Vereist verrijking 'zonder redelijke grond';
      een wettelijke taak en een overeenkomst vormen juist zo'n grond.
    categorieen: [ongerechtvaardigde_verrijking]
  - key: bw6-74
    wet: BW6
    artikel: "6:74"
    vindplaats: "art. 6:74 BW"
    onderwerp: "Tekortkoming in de nakoming"
    categorieen: [hoogte_rente_en_incassokosten]

  # --- Eigendom van netten --------------------------------------------
  - key: bw5-20
    wet: BW5
    artikel: "5:20"
    vindplaats: "art. 5:20 BW"
    onderwerp: >-
      Eigendom van de grond en de uitzondering voor netten: de bevoegde aanlegger is
      eigenaar van het net. Relevant bij 'de kabel ligt op mijn grond dus is van mij'.
    categorieen: [feitelijke_aansluiting_betwist, pseudojuridisch]

  # --- Bestuursrecht: juist om uit te leggen dat het NIET geldt -------
  - key: awb-1-1
    wet: Awb
    artikel: "1:1"
    vindplaats: "art. 1:1 Awb"
    onderwerp: >-
      Definitie van bestuursorgaan. Gebruikt om uit te leggen dat de netbeheerder dat
      niet is en dat de Awb-bezwaarprocedure hier niet geldt.
    categorieen: [awb_verwarring]

# Artikelzoekers: de agent zoekt de artikelnummers zelf op in de opgehaalde wettekst.
#
# Waarom geen lijst met artikelnummers? Om dezelfde reden dat er geen ECLI's in de
# seed staan. Een artikelnummer dat uit het geheugen komt en er plausibel uitziet is
# precies het probleem dat deze agent moet opvangen. `sync artikelen` haalt de wet op
# bij het KOOP-repository, doorzoekt de artikelen op deze trefwoorden en slaat op wat
# er echt in staat, met het echte nummer en de echte tekst.
#
# `verplicht` moet allemaal voorkomen in het artikel, `uitsluiten` mag juist niet
# voorkomen, en `trefwoorden` bepalen de rangschikking. Een artikel dat geen enkel
# trefwoord raakt valt af: dat is meestal een bepaling die toevallig dezelfde
# begrippen noemt. Wat gevonden wordt krijgt de tag `auto-gemapt`: de tekst is
# geverifieerd, maar of het artikel bij deze bezwaarcategorie hoort beoordeelt een
# jurist. Pas na accorderen mag de agent ernaar verwijzen.

artikelzoekers:
  - key: ew-aansluittaak
    wet: Ew
    doel: "De wettelijke taak van de netbeheerder om aan te sluiten"
    verplicht: ["netbeheerder", "aansluiting"]
    trefwoorden: ["taak", "verzoek", "realiseren", "aansluiten", "aangeslotene"]
    uitsluiten: ["tarief", "boete"]
    categorieen: [geen_ondertekend_contract, feitelijke_aansluiting_betwist, geen_verbruik]
    maximum: 4

  - key: ew-transporttaak
    wet: Ew
    doel: "De transporttaak en de verplichting transport aan te bieden"
    verplicht: ["netbeheerder", "transport"]
    trefwoorden: ["taak", "aanbieden", "uitvoeren", "verzoek", "aangeslotene"]
    uitsluiten: ["tarief"]
    categorieen: [geen_verbruik, leegstand_of_sloop]
    maximum: 4

  - key: ew-verwijdering-aansluiting
    wet: Ew
    doel: "Wijzigen of verwijderen van een aansluiting op verzoek"
    verplicht: ["aansluiting", "verwijder"]
    trefwoorden: ["wijzigen", "verzoek", "kosten", "aangeslotene"]
    categorieen: [leegstand_of_sloop, feitelijke_aansluiting_betwist]
    maximum: 3

  - key: ew-leveringsovereenkomst
    wet: Ew
    doel: "De verplichting van een eindafnemer om een leveringsovereenkomst te hebben"
    verplicht: ["leveringsovereenkomst"]
    trefwoorden: ["eindafnemer", "leverancier", "aangeslotene", "verplicht", "sluiten"]
    categorieen: [geen_ondertekend_contract, reeds_leverancier_gevonden]
    maximum: 5

  - key: ew-tarieven
    wet: Ew
    doel: "Vaststelling van tarieven door de ACM en de verplichting die in rekening te brengen"
    verplicht: ["tarief"]
    trefwoorden: ["ACM", "vaststellen", "aansluiting", "transport", "in rekening"]
    categorieen: [geen_verbruik, hoogte_rente_en_incassokosten, leegstand_of_sloop]
    maximum: 5

  - key: ew-afsluiten
    wet: Ew
    doel: "Beeindigen van transport of afsluiten van een aansluiting"
    verplicht: ["afsluit"]
    trefwoorden: ["eindafnemer", "beeindigen", "transport", "kleinverbruiker"]
    categorieen: [schrijnende_omstandigheden, awb_verwarring]
    maximum: 4

  - key: tare-periodieke-aansluitvergoeding
    wet: TarE
    doel: "Periodieke aansluitvergoeding en vastrecht: niet verbruiksafhankelijk"
    verplicht: ["aansluit"]
    trefwoorden: ["periodiek", "vergoeding", "vastrecht", "tarief", "capaciteit"]
    categorieen: [geen_verbruik, leegstand_of_sloop, hoogte_rente_en_incassokosten]
    maximum: 5

  - key: bege-aangeslotene
    wet: BegE
    doel: "Definitie van aangeslotene: wie is de betalingsplichtige partij?"
    verplicht: ["aangeslotene"]
    trefwoorden: ["definitie", "eigenaar", "gebruiker", "onroerende zaak", "rechthebbende"]
    categorieen: [verkeerde_partij, geen_ondertekend_contract]
    maximum: 3

# Materiaal dat niet in het BWB staat en dus door de afdeling zelf wordt aangeleverd
# via POST /api/kennisbank/bronnen.
regelingen:
  - key: werkinstructie-asc
    titel: "Interne werkinstructie Aansluiting Zonder Contract"
    categorieen: [geen_ondertekend_contract, leegstand_of_sloop, verkeerde_partij]
    aanleveren_door: "afdeling ASC"
  - key: standaardparagrafen-asc
    titel: "Vastgestelde standaardparagrafen voor uitgaande brieven"
    categorieen: [geen_ondertekend_contract, geen_verbruik, awb_verwarring]
    aanleveren_door: "afdeling ASC"
  - key: afsluitbeleid-kleinverbruikers
    titel: "Regeling afsluitbeleid voor kleinverbruikers van elektriciteit, gas en warmte"
    categorieen: [schrijnende_omstandigheden]
    aanleveren_door: "afdeling ASC"
    notitie: >-
      Controleer of deze regeling onder de Energiewet is vervangen; zo ja, haal de
      opvolger op met `sync resolve-bwb` in plaats van hem handmatig aan te leveren.
